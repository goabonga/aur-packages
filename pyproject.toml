# This repository ships no Python package. The only reason a pyproject
# exists is to give `uv` a project to lock, so the documentation build
# installs a pinned Zensical (`uv sync --frozen --only-group doc`) rather
# than whatever the index serves that morning.
#
# `package = false` tells uv not to build or install this directory.

[project]
name = "aur-packages"
version = "0.0.0"
description = "The AUR packages I run on my Arch Linux GPD Pocket 1."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]

[tool.uv]
package = false

[dependency-groups]
# Tooling for the helper scripts under scripts/. Ruff lints and formats
# them; there is no application code to type-check, so no mypy.
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]
doc = [
    "zensical",
]
# Branding-asset tooling, isolated from `doc` so the documentation build
# never drags a native cairo stack in. Only scripts/regen-icons.sh
# installs it, on demand, via `uv run --only-group favicon`.
favicon = [
    "cairosvg>=2.7",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["scripts"]
extend-exclude = [".venv", "site"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
