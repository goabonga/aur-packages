[project]
site_name = "aur-packages"
site_description = "The AUR packages I run on my Arch Linux GPD Pocket 1 - some specific to the machine, most not: one monorepo, per-package versioning from conventional commits, automated publication to the AUR."
site_author = "Chris"
site_url = "https://goabonga.github.io/aur-packages/"

repo_url = "https://github.com/goabonga/aur-packages"
repo_name = "goabonga/aur-packages"

copyright = """
Made with <span style="color: #e25555;">&#10084;</span> by
<a href="https://github.com/goabonga" target="_blank" rel="noopener">goabonga</a>
"""

# Explicit navigation. `packages/index.md` is the hand-written overview;
# the per-package pages under it are generated from each
# packages/<name>/README.md by scripts/gen-package-docs.py. The entry
# below is inserted by scripts/new-package.sh, so adding a package needs
# no manual edit here either.
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Packages" = [
      { "Overview" = "packages/index.md" },
  ] },
  { "Authoring a package" = "authoring.md" },
  { "Versioning and release" = "releasing.md" },
  { "Pipeline" = "pipeline.md" },
]

[project.theme]
language = "en"

# Generated from assets/aur-packages.svg by scripts/regen-icons.sh and
# committed: the docs build never installs the `favicon` group, which
# carries a native cairo stack. Paths resolve relative to the docs dir.
logo = "aur-packages.svg"
favicon = "favicon.ico"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  # `navigation.indexes` and `navigation.sections` are deliberately
  # absent, and both would break the same thing.
  #
  # `sections` renders a top-level section as a flat group above 1220px:
  # every child always visible, the title inert. That is the opposite of
  # a submenu you open.
  #
  # `indexes` attaches the overview page to the section title, so the
  # title navigates and only the chevron toggles - clicking "Packages"
  # would leave the submenu shut.
  #
  # Without them the whole title is the toggle at every width, and the
  # overview stays reachable as the section's first entry.
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Arch blue, matching the distribution the packages target.
[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Drops the theme's "Made with Zensical" line so the footer carries one
# credit rather than two.
[project.extra]
generator = false

# Owned by multicz: the `docs` component lists this key in its
# `bump_files`, so a docs release writes the site version here. The site
# never renders the number - the point is that the docs get a tag.
[project.extra.versions]
docs = "0.0.0"


[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
