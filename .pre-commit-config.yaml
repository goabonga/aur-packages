# Local hooks mirroring the CI gates. Install once per clone:
# `uv run --only-group dev pre-commit install` (installs the pre-commit
# AND commit-msg hooks).

default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # .SRCINFO is generated by makepkg and CI diffs its exact bytes,
        # so a hook that reformats it would fail the next push.
        exclude: (^|/)\.SRCINFO$
      - id: end-of-file-fixer
        exclude: (^|/)\.SRCINFO$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --only-group dev ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --only-group dev ruff format
        language: system
        types: [python]
        require_serial: true

  - repo: local
    hooks:
      # The invariant. Cheap, and the breakage it catches is otherwise
      # silent, so it runs on every commit rather than on a path filter.
      - id: check-packages
        name: package names and multicz wiring
        entry: python3 scripts/check-packages.py
        language: system
        pass_filenames: false
        always_run: true
      - id: multicz-validate
        name: multicz validate --strict
        entry: uv tool run multicz validate --strict
        language: system
        pass_filenames: false
        files: ^(multicz\.toml|packages/.*|zensical\.toml)$
      - id: gen-package-docs
        name: generated package pages are current
        entry: python3 scripts/gen-package-docs.py --check
        language: system
        pass_filenames: false
        files: ^packages/[^/]+/README\.md$

  - repo: local
    hooks:
      - id: lint-pkgbuild
        name: lint every PKGBUILD
        # Runs the same helper CI does. Off Arch it degrades to the
        # shellcheck pass, which is the part a pre-commit hook can do.
        entry: scripts/lint-package.sh
        language: system
        pass_filenames: false
        files: ^(packages/|template/)
      - id: shellcheck-scripts
        name: shellcheck (scripts/)
        entry: shellcheck -x
        language: system
        files: ^scripts/.*\.sh$
      - id: spdx-headers-scripts
        name: SPDX headers (scripts/)
        entry: python3 scripts/add_license_header.py --path scripts --types py,sh --check
        language: system
        pass_filenames: false
        files: ^scripts/.*\.(py|sh)$
      - id: spdx-headers-root-toml
        name: SPDX headers (root *.toml)
        entry: python3 scripts/add_license_header.py --path . --types toml --check
        language: system
        pass_filenames: false
        files: ^[^/]+\.toml$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # The closed list multicz reads. `build` is the packaging-specific
        # one: same upstream content, assembled differently.
        args:
          - feat
          - fix
          - perf
          - revert
          - refactor
          - docs
          - test
          - chore
          - ci
          - build
          - style
