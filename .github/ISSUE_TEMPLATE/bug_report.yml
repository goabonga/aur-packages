name: Bug report
description: A package fails to build, install, or misbehaves once installed
labels: ["bug"]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: The package name, exactly as it appears under packages/
      placeholder: gpd-pocket-config
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of: pacman -Qi <package> | grep Version"
      placeholder: 0.2.1-1
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where it fails
      options:
        - Building (makepkg)
        - Installing (pacman -U / helper)
        - After installation, at runtime
        - Uninstalling
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full error output. Paste it as text, not a screenshot.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Hardware, kernel and pacman version: uname -a; pacman -Q pacman"
      render: shell
    validations:
      required: true
