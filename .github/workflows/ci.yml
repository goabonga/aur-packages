name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded pull-request runs; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Repository hygiene: the helper scripts, the multicz configuration and
  # the workflows themselves. Everything here acts on something that
  # exists in the tree today.
  # ---------------------------------------------------------------------
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: SPDX headers
        run: |
          python3 scripts/add_license_header.py --path scripts --types py,sh --check
          python3 scripts/add_license_header.py --path . --types toml --check
      - name: Lint the helper scripts
        run: uv run --frozen --only-group dev ruff check --output-format=github scripts/
      - name: Format check
        run: uv run --frozen --only-group dev ruff format --check scripts/
      - name: Shellcheck the helper scripts
        # -x follows `source scripts/pkgdirs.sh`.
        run: shellcheck -x scripts/*.sh
      - name: Shellcheck every PKGBUILD in the tree
        # lint-package.sh skips the makepkg-dependent checks when makepkg
        # is missing, so on ubuntu this is exactly the shellcheck pass.
        # The Arch-side checks run in the `template` job.
        run: scripts/lint-package.sh
      - name: Validate the multicz configuration
        run: uv tool run multicz validate --strict
      - name: Lint the workflows
        # actionlint type-checks expressions, the needs graph and matrix
        # references, and runs shellcheck over every `run:` block - where
        # the script-injection class of bug lives.
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="pass - headers, ruff, shellcheck, multicz and actionlint are clean"
          else
            STATUS="fail - see annotations and logs"
          fi
          echo "## Checks: $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # The template, and the scaffolder that copies it.
  #
  # Scaffolds a throwaway package exactly the way the documentation tells
  # a contributor to, then builds and installs the result. That exercises
  # `template/`, `scripts/new-package.sh` and the documented workflow in
  # one go - and it is the only coverage either of them has.
  # ---------------------------------------------------------------------
  template:
    name: template
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          # uv is needed because new-package.sh finishes by running
          # `multicz validate --strict` on what it produced - the job
          # exercises the documented flow, so it needs the tools the flow
          # documents.
          pacman -Syu --noconfirm --needed git namcap pacman-contrib shellcheck uv
          # makepkg refuses to run as root, by design.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
      - name: Scaffold a package from the template
        env:
          # A name no real package will take, so a leftover cannot collide.
          PKG: ci-template-check
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          scripts/new-package.sh "$PKG"
      - name: Refresh checksums and regenerate .SRCINFO
        # The copy renamed the payload files, so the inherited checksums
        # no longer describe them. These are the documented next steps.
        env:
          PKG: ci-template-check
        run: |
          set -euo pipefail
          chown -R builder .
          cd "packages/$PKG"
          su builder -c 'updpkgsums'
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO.new
          mv .SRCINFO.new .SRCINFO
      - name: The scaffolded package passes the local checks
        # As builder, like every other step here: lint-package.sh calls
        # makepkg, and makepkg refuses to run as root.
        run: |
          set -euo pipefail
          chown -R builder .
          su builder -c 'scripts/lint-package.sh ci-template-check'
      - name: Build, install and remove it
        env:
          PKG: ci-template-check
        run: |
          set -euo pipefail
          chown -R builder .
          cd "packages/$PKG"
          su builder -c 'makepkg -sf --noconfirm --needed'
          output=$(namcap ./*.pkg.tar.zst || true)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q ' E: '; then
            echo "::error::namcap reported errors on a package built from the template"
            exit 1
          fi
          pacman -U --noconfirm ./*.pkg.tar.zst
          pacman -Qi "$PKG"
          # A package that builds but installs nothing is a real failure
          # mode: wrong install paths produce a valid, empty archive.
          files=$(pacman -Qlq "$PKG" | grep -vE '/$' || true)
          if [ -z "$files" ]; then
            echo "::error::$PKG installed no files"
            exit 1
          fi
          printf '%s\n' "$files"
          pacman -Rns --noconfirm "$PKG"
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="pass - the template still scaffolds a package that builds and installs"
          else
            STATUS="fail - template/ or scripts/new-package.sh is broken (see logs)"
          fi
          echo "## Template: $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Release. Bumps every component the planner says moved, writes the
  # changelogs, commits, tags and pushes. Today the only component is the
  # documentation site; packages add themselves as they land.
  # ---------------------------------------------------------------------
  release:
    name: release
    needs: [checks, template]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release commit and the tags
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        # Both values come through the environment rather than being
        # interpolated: a commit author name is attacker-chosen text, and
        # ${{ }} is substituted before bash ever sees the line.
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        # Secrets cannot be referenced from `if:`, so their presence is
        # promoted to a step output. Unset means an unsigned release,
        # not a failed one.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock the GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase with a throwaway signature so
          # `git commit -S` and `git tag -s` do not prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      - name: Plan the release
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Bump, commit, tag and push
        id: bump
        env:
          SIGN: ${{ steps.gpg.outputs.available }}
        run: |
          set -euo pipefail
          if [ "$SIGN" = "true" ]; then
            PLAN=$(uv tool run multicz bump --commit --tag --push --sign --output json)
          else
            PLAN=$(uv tool run multicz bump --commit --tag --push --output json)
          fi
          if [ "$(echo "$PLAN" | jq -r '.bumps | length')" = "0" ]; then
            NO_BUMPS=true
          else
            NO_BUMPS=false
          fi
          {
            echo "bumped=$(echo "$PLAN" | jq -r '.bumps | keys | join(" ")')"
            echo "no_bumps=$NO_BUMPS"
          } >> "$GITHUB_OUTPUT"
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ steps.bump.outputs.no_bumps }}" = "true" ]; then
            echo "## Release: nothing to bump" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Release: tags pushed"
            echo ""
            echo "| Component | Version |"
            echo "| --- | --- |"
            for c in ${{ steps.bump.outputs.bumped }}; do
              echo "| \`$c\` | \`$(uv tool run multicz get "$c")\` |"
            done
            echo ""
            echo "Signed: \`${{ steps.gpg.outputs.available }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Deploy the site from the release commit, so what is published
  # describes the tree that was actually released rather than the tree
  # that triggered CI.
  # ---------------------------------------------------------------------
  docs:
    name: docs
    needs: release
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The release commit multicz just pushed.
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical
        # --only-group doc installs the locked Zensical without the dev
        # group, so a Zensical release cannot break Pages between two
        # unrelated pushes.
        run: uv sync --frozen --only-group doc
      - name: Build the site
        run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "## Docs deployed"
              echo ""
              echo "Bumped this run: \`${{ needs.release.outputs.bumped }}\`"
              echo ""
              echo "Site: ${{ steps.deployment.outputs.page_url }}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Docs deployment failed (see logs)" >> "$GITHUB_STEP_SUMMARY"
          fi
