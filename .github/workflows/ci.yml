name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded pull-request runs; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Repository hygiene: the helper scripts, the multicz configuration and
  # the workflows themselves. Everything here acts on something that
  # exists in the tree today.
  # ---------------------------------------------------------------------
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: SPDX headers
        run: |
          python3 scripts/add_license_header.py --path scripts --types py,sh --check
          python3 scripts/add_license_header.py --path . --types toml --check
      - name: Lint the helper scripts
        run: uv run --frozen --only-group dev ruff check --output-format=github scripts/
      - name: Format check
        run: uv run --frozen --only-group dev ruff format --check scripts/
      - name: Shellcheck the helper scripts
        # -x follows `source scripts/pkgdirs.sh`.
        run: shellcheck -x scripts/*.sh
      - name: Shellcheck every PKGBUILD in the tree
        # lint-package.sh skips the makepkg-dependent checks when makepkg
        # is missing, so on ubuntu this is exactly the shellcheck pass.
        # The Arch-side checks run in the `template` job.
        run: scripts/lint-package.sh
      - name: Validate the multicz configuration
        run: uv tool run multicz validate --strict
      - name: Package names, multicz wiring and generated pages
        run: |
          python3 scripts/check-packages.py
          python3 scripts/gen-package-docs.py --check
      - name: Lint the workflows
        # actionlint type-checks expressions, the needs graph and matrix
        # references, and runs shellcheck over every `run:` block - where
        # the script-injection class of bug lives.
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="pass - headers, ruff, shellcheck, multicz and actionlint are clean"
          else
            STATUS="fail - see annotations and logs"
          fi
          echo "## Checks: $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # The template, and the scaffolder that copies it.
  #
  # Scaffolds a throwaway package exactly the way the documentation tells
  # a contributor to, then builds and installs the result. That exercises
  # `template/`, `scripts/new-package.sh` and the documented workflow in
  # one go - and it is the only coverage either of them has.
  # ---------------------------------------------------------------------
  template:
    name: template
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          # uv is needed because new-package.sh finishes by running
          # `multicz validate --strict` on what it produced - the job
          # exercises the documented flow, so it needs the tools the flow
          # documents.
          pacman -Syu --noconfirm --needed git namcap pacman-contrib shellcheck uv
          # makepkg refuses to run as root, by design.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
      - name: Scaffold a package from the template
        env:
          # A name no real package will take, so a leftover cannot collide.
          PKG: ci-template-check
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          scripts/new-package.sh "$PKG"
      - name: Refresh checksums and regenerate .SRCINFO
        # The copy renamed the payload files, so the inherited checksums
        # no longer describe them. These are the documented next steps.
        env:
          PKG: ci-template-check
        run: |
          set -euo pipefail
          chown -R builder .
          cd "packages/$PKG"
          su builder -c 'updpkgsums'
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO.new
          mv .SRCINFO.new .SRCINFO
      - name: The scaffolded package passes the local checks
        # As builder, like every other step here: lint-package.sh calls
        # makepkg, and makepkg refuses to run as root.
        run: |
          set -euo pipefail
          chown -R builder .
          su builder -c 'scripts/lint-package.sh ci-template-check'
      - name: Build, install and remove it
        env:
          PKG: ci-template-check
        run: |
          set -euo pipefail
          chown -R builder .
          cd "packages/$PKG"
          su builder -c 'makepkg -sf --noconfirm --needed'
          output=$(namcap ./*.pkg.tar.zst || true)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q ' E: '; then
            echo "::error::namcap reported errors on a package built from the template"
            exit 1
          fi
          pacman -U --noconfirm ./*.pkg.tar.zst
          pacman -Qi "$PKG"
          # A package that builds but installs nothing is a real failure
          # mode: wrong install paths produce a valid, empty archive.
          files=$(pacman -Qlq "$PKG" | grep -vE '/$' || true)
          if [ -z "$files" ]; then
            echo "::error::$PKG installed no files"
            exit 1
          fi
          printf '%s\n' "$files"
          pacman -Rns --noconfirm "$PKG"
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="pass - the template still scaffolds a package that builds and installs"
          else
            STATUS="fail - template/ or scripts/new-package.sh is broken (see logs)"
          fi
          echo "## Template: $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Which packages changed?
  #
  # Asked of multicz rather than computed from a path diff, and the
  # difference matters on main: a path diff answers "what did this push
  # touch?", while `multicz changed` with no --since compares each
  # component against its OWN last tag, which answers "what is
  # unreleased?". That is the question the release job asks minutes
  # later, so asking it here keeps the tested set and the released set
  # identical - a package whose previous release failed still gets
  # rechecked.
  # ---------------------------------------------------------------------
  detect:
    name: detect changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
      has_packages: ${{ steps.changed.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - id: changed
        name: Compute changed components
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            ALL=$(uv tool run multicz changed --since "origin/$BASE_REF" --output json | jq -c '.changed')
          else
            ALL=$(uv tool run multicz changed --output json | jq -c '.changed')
          fi
          # `docs` is tracked by multicz but owns no packages/ tree, so
          # the per-package matrix cannot walk it. It has its own job.
          PACKAGES=$(echo "$ALL" | jq -c 'map(select(. != "docs"))')
          if [ "$PACKAGES" = "[]" ] || [ -z "$PACKAGES" ]; then
            HAS=false
          else
            HAS=true
          fi
          {
            echo "packages=$PACKAGES"
            echo "has_packages=$HAS"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Detected changes"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Packages | \`$PACKAGES\` |"
            echo "| Event | \`$EVENT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Per-package metadata checks, over ONLY the packages that changed.
  #
  # Everything here is cheap: no package is built. That is deliberate -
  # the AUR distributes sources, not binaries, so nothing downstream of
  # this needs a compiled artefact, and one of these packages is a
  # kernel. Building it is an hour of wall clock, so it lives behind the
  # manual `build-package` workflow instead of running on every push.
  # ---------------------------------------------------------------------
  package:
    name: package (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git namcap shellcheck
          # makepkg refuses to run as root, by design.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v7
      - name: Check the package
        # shellcheck, .SRCINFO drift and namcap. The checksum check needs
        # the sources, which the next step fetches.
        run: |
          set -euo pipefail
          chown -R builder .
          su builder -c "scripts/lint-package.sh ${{ matrix.package }}"
      - name: Verify the committed checksums against upstream
        # Downloads every declared source and hashes it. This is the step
        # that catches a pkgver bumped without refreshing sha256sums.
        run: |
          set -euo pipefail
          chown -R builder .
          cd "packages/${{ matrix.package }}"
          su builder -c 'makepkg --verifysource --noconfirm --skippgpcheck'
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="pass - metadata, .SRCINFO and checksums are consistent"
          else
            STATUS="fail - see logs"
          fi
          echo "## Package - \`${{ matrix.package }}\`: $STATUS" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Release. Bumps every component the planner says moved, writes the
  # changelogs, commits, tags and pushes. Today the only component is the
  # documentation site; packages add themselves as they land.
  # ---------------------------------------------------------------------
  release:
    name: release
    needs: [checks, template, detect, package]
    # `package` is skipped when no package changed, and a skipped `needs`
    # would normally skip this job too. `!cancelled()` lifts that, which
    # means the failure check has to be spelled out explicitly rather
    # than implied by `needs`.
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release commit and the tags
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      bumped: ${{ steps.bump.outputs.bumped }}
      # `bumped` minus `docs`, which has no AUR repository. This is what
      # the aur-publish matrix expands over; on a docs-only release it is
      # empty and that job does not run.
      bumped_pkg_json: ${{ steps.bump.outputs.bumped_pkg_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        # Both values come through the environment rather than being
        # interpolated: a commit author name is attacker-chosen text, and
        # ${{ }} is substituted before bash ever sees the line.
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        # Secrets cannot be referenced from `if:`, so their presence is
        # promoted to a step output. Unset means an unsigned release,
        # not a failed one.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock the GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase with a throwaway signature so
          # `git commit -S` and `git tag -s` do not prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      - name: Plan the release
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Bump, commit, tag and push
        id: bump
        env:
          SIGN: ${{ steps.gpg.outputs.available }}
        run: |
          set -euo pipefail
          if [ "$SIGN" = "true" ]; then
            PLAN=$(uv tool run multicz bump --commit --tag --push --sign --output json)
          else
            PLAN=$(uv tool run multicz bump --commit --tag --push --output json)
          fi
          if [ "$(echo "$PLAN" | jq -r '.bumps | length')" = "0" ]; then
            NO_BUMPS=true
          else
            NO_BUMPS=false
          fi
          {
            echo "bumped=$(echo "$PLAN" | jq -r '.bumps | keys | join(" ")')"
            echo "bumped_pkg_json=$(echo "$PLAN" | jq -c '.bumps | keys | map(select(. != "docs"))')"
            echo "no_bumps=$NO_BUMPS"
          } >> "$GITHUB_OUTPUT"
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ steps.bump.outputs.no_bumps }}" = "true" ]; then
            echo "## Release: nothing to bump" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Release: tags pushed"
            echo ""
            echo "| Component | Version |"
            echo "| --- | --- |"
            for c in ${{ steps.bump.outputs.bumped }}; do
              # From the tag, not from `multicz get`: a component that
              # tracks upstream declares no bump_files, and `get` reads
              # the version out of one.
              echo "| \`$c\` | \`$(git describe --tags --match "$c-v*" --abbrev=0)\` |"
            done
            echo ""
            echo "Signed: \`${{ steps.gpg.outputs.available }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Publish each released package to its own AUR repository.
  #
  # Nothing is built here: the AUR distributes sources. The job pushes
  # the PKGBUILD, the .SRCINFO and the committed source files, which is
  # all an AUR repository holds.
  #
  # One job per package (`fail-fast: false`): if the AUR rejects one, the
  # others still ship and the failed one is re-runnable on its own. Each
  # gets its own `aur-<name>` environment, so a required reviewer can
  # gate one package without gating the rest.
  # ---------------------------------------------------------------------
  aur-publish:
    name: aur-publish (${{ matrix.package }})
    needs: release
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
      && needs.release.outputs.bumped_pkg_json != '[]'
      && needs.release.outputs.bumped_pkg_json != ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.release.outputs.bumped_pkg_json) }}
    environment:
      name: aur-${{ matrix.package }}
      url: https://aur.archlinux.org/packages/${{ matrix.package }}
    permissions:
      contents: write       # gh release create
    steps:
      - name: Prepare the container
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh github-cli uv
          useradd -m builder
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The release commit and tags multicz just pushed.
          ref: main
      - name: Read the version being published
        id: version
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          cd "packages/$PKG"
          # Read from the PKGBUILD, not from the release outputs: this is
          # the file that gets pushed, so it is the only version that
          # cannot disagree with what ships.
          pkgver=$(sed -n 's/^pkgver=\(.*\)$/\1/p' PKGBUILD | tr -d "\"'")
          pkgrel=$(sed -n 's/^pkgrel=\(.*\)$/\1/p' PKGBUILD | tr -d "\"'")
          {
            echo "pkgver=$pkgver"
            echo "pkgrel=$pkgrel"
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate .SRCINFO with makepkg
        run: |
          set -euo pipefail
          chown -R builder .
          cd "packages/${{ matrix.package }}"
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO.new
          mv .SRCINFO.new .SRCINFO
      # Before the AUR push, not after: the tag this documents was
      # created and pushed by the release job, so it describes real
      # released code whether or not the AUR accepts it. Ordering it
      # last meant one unreachable host left the release unrecorded.
      - name: Create the GitHub Release
        env:
          # A release created through the API belongs to whoever owns the
          # token, and github.token is github-actions[bot] - which is why
          # releases show up under the bot even though the commit and the
          # tag it points at are authored, signed and tagged by the
          # maintainer. No git setting can change that; only a different
          # token can.
          #
          # RELEASE_TOKEN is a fine-grained PAT with contents:write on
          # this repository. Without it this falls back to the bot rather
          # than failing, so the pipeline still works before you make one.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          # The tag multicz just created. Read from git rather than from
          # `multicz get`, which resolves a version out of bump_files - a
          # component whose pkgver tracks upstream declares none.
          tag=$(git describe --tags --match "${PKG}-v*" --abbrev=0)
          # Notes for this tag only: the package CHANGELOG accumulates
          # every release, so attaching it whole would make the second
          # release repeat the first.
          uv tool run multicz release-notes --tag "$tag" > /tmp/notes.md
          cat /tmp/notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --title "$PKG ${{ steps.version.outputs.pkgver }}-${{ steps.version.outputs.pkgrel }}" \
              --notes-file /tmp/notes.md
          fi
      - name: Detect AUR credentials
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH for the AUR
        if: steps.aur.outputs.available == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # Optional repository variable holding the pinned host key lines
          # for aur.archlinux.org. Set it to close the trust-on-first-use
          # window below.
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Everything lives at an absolute path under RUNNER_TEMP and is
          # handed to git explicitly, rather than in ~/.ssh and left for
          # ssh to find. `~` depends on HOME, and HOME is not something a
          # container job should be trusted to agree on between steps -
          # a first attempt wrote a perfectly good known_hosts and still
          # died on "Host key verification failed" one step later.
          d="$RUNNER_TEMP/aur-ssh"
          mkdir -p "$d" && chmod 700 "$d"

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$d/id"
          chmod 600 "$d/id"

          if [ -n "${AUR_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > "$d/known_hosts"
          else
            # stderr is kept: hiding it once turned an empty keyscan into
            # a bare "Host key verification failed" two steps later, with
            # nothing in the log pointing at the cause.
            ssh-keyscan -t ed25519,rsa aur.archlinux.org > "$d/known_hosts"
            echo "::warning::AUR_SSH_KNOWN_HOSTS is not set - the host key was accepted on first use."
          fi
          chmod 600 "$d/known_hosts"

          # Assert the file actually names the host. An empty or
          # comment-only known_hosts passes every check above and then
          # fails opaquely inside git.
          if ! grep -q '^aur\.archlinux\.org' "$d/known_hosts"; then
            echo "::error::no host key for aur.archlinux.org was recorded - refusing to continue"
            cat "$d/known_hosts"
            exit 1
          fi
          echo "Recorded $(grep -c '^aur\.archlinux\.org' "$d/known_hosts") host key(s)."

          # Every later step reaches the AUR through exactly this command.
          echo "GIT_SSH_COMMAND=ssh -i $d/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$d/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

          # Prove the key authenticates before anything tries to push. The
          # AUR always exits non-zero here, printing either a greeting or
          # a refusal, so the message is the signal rather than the code.
          ssh -i "$d/id" -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$d/known_hosts" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes \
              aur@aur.archlinux.org help 2>&1 | head -3 || true
      - name: Push to the AUR
        if: steps.aur.outputs.available == 'true'
        env:
          PKG: ${{ matrix.package }}
          PKGVER: ${{ steps.version.outputs.pkgver }}
          PKGREL: ${{ steps.version.outputs.pkgrel }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Through the environment, never interpolated: see the release
          # job's "Configure git author" step.
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          set -euo pipefail
          git config --global user.name "${AUTHOR_NAME:-github-actions[bot]}"
          git config --global user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git config --global --add safe.directory '*'

          # The AUR serves a package that does not exist yet as an empty
          # repository rather than an error, so a clone that FAILS is
          # always a real problem - auth, host key, network - and never
          # "this is a new package".
          #
          # Treating the two as one is what produced a run that announced
          # "No AUR repository yet" for a package that has existed since
          # 2018, and then failed on the push it should never have
          # reached.
          if ! git clone "ssh://aur@aur.archlinux.org/${PKG}.git" /tmp/aur; then
            echo "::error::could not reach the AUR repository for ${PKG} - see the clone output above"
            exit 1
          fi
          if [ -z "$(git -C /tmp/aur rev-parse --verify HEAD 2>/dev/null)" ]; then
            echo "Empty AUR repository - ${PKG} is new and this push creates it."
          else
            echo "Cloned the existing AUR repository at $(git -C /tmp/aur rev-parse --short HEAD)."
          fi

          # Replace the tracked content wholesale so a file deleted here
          # is deleted there too. CHANGELOG.md and README.md stay behind:
          # they are repository bookkeeping and link to paths that do not
          # exist in the AUR clone.
          find /tmp/aur -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for f in "packages/${PKG}"/* "packages/${PKG}"/.SRCINFO; do
            base=$(basename "$f")
            case "$base" in
              CHANGELOG.md|README.md|pkg|src|*.pkg.tar.zst|*.log) continue ;;
            esac
            cp -r "$f" /tmp/aur/
          done

          cd /tmp/aur
          git add -A
          if git diff --cached --quiet; then
            # multicz released this component, so something in it changed -
            # but nothing that reaches the AUR did. For a package whose
            # pkgver tracks upstream that means pkgrel was not bumped, and
            # the release is a no-op nobody would notice.
            echo "::error::${PKG} was released but its AUR content is unchanged - bump pkgrel (or pkgver) so the release actually ships"
            exit 1
          fi
          git commit -q -m "${PKG} ${PKGVER}-${PKGREL}

          Released from https://github.com/${REPO} at ${SHA}."
          git push origin HEAD:master
          echo "Pushed ${PKG} ${PKGVER}-${PKGREL} to the AUR."
      - name: Report the dry run
        if: steps.aur.outputs.available != 'true'
        run: |
          {
            echo "## AUR publish - \`${{ matrix.package }}\`: dry run"
            echo ""
            echo "\`AUR_SSH_PRIVATE_KEY\` is not set, so nothing was pushed."
            echo "Version \`${{ steps.version.outputs.pkgver }}-${{ steps.version.outputs.pkgrel }}\`"
            echo "is ready to publish once the secret exists."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Deploy the site from the release commit, so what is published
  # describes the tree that was actually released rather than the tree
  # that triggered CI.
  # ---------------------------------------------------------------------
  docs:
    name: docs
    needs: release
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The release commit multicz just pushed.
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical
        # --only-group doc installs the locked Zensical without the dev
        # group, so a Zensical release cannot break Pages between two
        # unrelated pushes.
        run: uv sync --frozen --only-group doc
      - name: Build the site
        run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Write step summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "## Docs deployed"
              echo ""
              echo "Bumped this run: \`${{ needs.release.outputs.bumped }}\`"
              echo ""
              echo "Site: ${{ steps.deployment.outputs.page_url }}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Docs deployment failed (see logs)" >> "$GITHUB_STEP_SUMMARY"
          fi
